name: R3 repair checks

on:
  push:
    branches:
      - 'r3-repair/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r3-repair-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [gates, planner, routine, helper, signer, nonce-regression]
    env:
      # Official Node 22.22.0 bookworm image, verified against Docker Hub metadata.
      R3_TEST_IMAGE: node:22.22.0-bookworm@sha256:20a424ecd1d2064a44e12fe287bf3dae443aab31dc5e0c0cb6c74bef9c78911c
      R3_NONCE_BASELINE: 4ea4b38b39b30ffb953510c56847d32d7474d9f1
      R3_TEST_SUITE: ${{ matrix.suite }}
      R3_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Read exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.R3_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R3_CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/r3-source" "$RUNNER_TEMP/r3-deps" "$RUNNER_TEMP/r3-evidence"
          git archive HEAD .claude r3.cjs ci/run-repair-tests.sh | tar -x -C "$RUNNER_TEMP/r3-source"
          cp ci/repair-deps/package.json ci/repair-deps/package-lock.json "$RUNNER_TEMP/r3-deps/"
          docker pull "$R3_TEST_IMAGE"
          # No candidate code, wallet data, GitHub token, host home or .git is mounted here.
          # npm lifecycle scripts are disabled; all packages and integrity hashes are locked.
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,size=1g \
            --mount "type=bind,src=$RUNNER_TEMP/r3-deps,dst=/deps" --workdir /deps \
            --env npm_config_cache=/tmp/npm-cache \
            "$R3_TEST_IMAGE" npm ci --ignore-scripts --no-audit --no-fund --omit=dev

      - name: Prepare original-code regression fixture
        if: matrix.suite == 'nonce-regression'
        shell: bash
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null fetch --no-tags origin "$R3_NONCE_BASELINE"
          mkdir -p "$RUNNER_TEMP/r3-baseline"
          git archive "$R3_NONCE_BASELINE" .claude r3.cjs | tar -x -C "$RUNNER_TEMP/r3-baseline"
          # The new test is run against the actual pre-fix modules, not a simulated old implementation.
          cp .claude/skills/deep-r3-trade/scripts/planner.test.cjs \
            "$RUNNER_TEMP/r3-baseline/.claude/skills/deep-r3-trade/scripts/planner.test.cjs"

      - name: Run isolated offline suite
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          run_isolated() {
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --pids-limit 512 --memory 4g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,size=3g \
              --mount "type=bind,src=$1,dst=/repo,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/r3-deps,dst=/deps,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/r3-source/ci,dst=/ci,readonly" \
              --workdir /repo/.claude/skills/deep-r3-trade/scripts \
              --env NODE_PATH=/deps/node_modules --env TMPDIR=/tmp \
              "$R3_TEST_IMAGE" bash /ci/run-repair-tests.sh "$R3_TEST_SUITE"
          }
          if [ "$R3_TEST_SUITE" = nonce-regression ]; then
            set +e
            run_isolated "$RUNNER_TEMP/r3-baseline" 2>&1 | tee "$RUNNER_TEMP/r3-evidence/baseline.log"
            baseline_exit=${PIPESTATUS[0]}
            set -e
            test "$baseline_exit" -eq 1
            grep -F 'FAIL  nonce-confirm: stale latest converges without resend' "$RUNNER_TEMP/r3-evidence/baseline.log"
            printf 'Original code reproduced the stale-nonce failure (exit %s).\n' "$baseline_exit"
          fi
          run_isolated "$RUNNER_TEMP/r3-source" 2>&1 | tee "$RUNNER_TEMP/r3-evidence/candidate.log"

      - name: Record exact test identity
        if: always()
        shell: bash
        env:
          R3_TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r3-evidence"
          R3_CODE_TREE="$(git ls-tree HEAD | awk -F '\t' '$2 != "run"' | git mktree)"
          export R3_CODE_TREE
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          root = workspace / '.claude/skills/deep-r3-trade/scripts'
          manifest = {
              'candidate_commit': os.environ['R3_CANDIDATE_SHA'],
              'code_tree_excluding_run': os.environ['R3_CODE_TREE'],
              'suite': os.environ['R3_TEST_SUITE'],
              'outcome': os.environ['R3_TEST_OUTCOME'],
              'image': os.environ['R3_TEST_IMAGE'],
              'node_version': '22.22.0',
              'ethers_version': '6.17.0',
              'dependency_lock_sha256': hashlib.sha256((workspace / 'ci/repair-deps/package-lock.json').read_bytes()).hexdigest(),
              'network': 'none; loopback mocks only',
              'wallet_credentials': 'not provided',
              'production_runtime_mounted': False,
              'workflow_run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'source_sha256': {str(p.relative_to(workspace)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*.cjs'))},
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r3-evidence/manifest.json'
          out.write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps({k:v for k,v in manifest.items() if k != 'source_sha256'}, indent=2))
          PY

      - name: Retain nonsecret test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-repair-${{ env.R3_CANDIDATE_SHA }}-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r3-evidence/
          if-no-files-found: error
          retention-days: 14
